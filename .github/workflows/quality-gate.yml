name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      LEAD_SUBMISSION_ENABLED: "false"
      NEXT_PUBLIC_ENABLE_GTM: "false"
      TURNSTILE_REQUIRED: "false"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets:verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run leads:test
      - run: npm run campaigns:test --if-present
      - run: npm run launch:test
      - run: npm run content:test
      - run: npm run build
      - run: npm run build:audit
      - run: npx playwright install --with-deps chromium
      - run: npm run visual:test
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
