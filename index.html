<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Website Design Dogs</title>
    <meta
      name="description"
      content="Website Design Dogs — professional websites built to deliver results."
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b1f3a;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }

      main {
        width: min(680px, 100%);
      }

      .eyebrow {
        margin-bottom: 16px;
        color: #ff6a00;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(42px, 8vw, 76px);
        line-height: 0.95;
      }

      h1 span {
        color: #ff6a00;
      }

      p {
        margin: 0 auto;
        max-width: 560px;
        color: #d7dee8;
        font-size: 18px;
        line-height: 1.6;
      }

      footer {
        margin-top: 40px;
        color: #98a4b5;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="eyebrow">Loyal to the game.</div>

      <h1>
        Website Design
        <span>Dogs</span>
      </h1>

      <p>
        Our new website is being designed and built. Professional websites,
        SEO, social media, mobile applications, and AI automation are coming
        soon.
      </p>

      <footer>
        A service brand of LA CREATIVO GROUP, LLC.
      </footer>
    </main>
  </body>
</html>
